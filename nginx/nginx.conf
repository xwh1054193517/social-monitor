# ============================================================
#  Social Monitor — reverse proxy (single entry point)
#  Serves the whole app under /web3/monitor:
#    https://www.eternalstar.xyz/web3/monitor/       -> web (Next.js)
#    https://www.eternalstar.xyz/web3/monitor/api/*  -> api (NestJS)
#    https://www.eternalstar.xyz/web3/monitor/health -> api health check
# ============================================================

upstream web_upstream {
  server web:3000;
}

upstream api_upstream {
  server api:3001;
}

server {
  listen 80;
  listen [::]:80;

  # Catch-all; change to your real domain(s) if you want strict Host matching:
  #   server_name www.eternalstar.xyz eternalstar.xyz;
  server_name _;

  client_max_body_size 8m;

  # ---------- Backend API (strip the /web3/monitor prefix) ----------
  # /web3/monitor/api/xxx  ->  api:3001/api/xxx
  location /web3/monitor/api/ {
    proxy_pass http://api_upstream/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # SSE (EventSource) needs no buffering and long-lived connections
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # ---------- Health check (public, no auth) ----------
  location = /web3/monitor/health {
    proxy_pass http://api_upstream/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---------- Frontend (keep the /web3/monitor prefix) ----------
  # Next.js has basePath=/web3/monitor, so it expects the full path.
  location /web3/monitor/ {
    proxy_pass http://web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }



  location = / {
    return 302 /web3/monitor/;
  }
}
