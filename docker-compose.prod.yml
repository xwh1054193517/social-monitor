services:
  # ============================================================
  # NOTE: PostgreSQL & Redis are NOT containerized here — they are
  # already running natively on the host (43.155.216.215) and hold the
  # Telegram session + all monitoring data. The api service connects to
  # them via host.docker.internal (see DB_*/REDIS_* in .env.production).
  # ============================================================

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sm-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      # 口令不设默认值：未在 .env.production 中配置时 compose 直接报错中止，
      # 既避免口令进入版本库，也防止空口令静默连库
      DATABASE_URL: postgresql://${DB_USER:-social_monitor}:${DB_PASSWORD:?DB_PASSWORD is required, set it in .env.production}@${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/${DB_NAME:-social_monitor}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required, set it in .env.production}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      QQ_APP_ID: ${QQ_APP_ID:-}
      QQ_APP_SECRET: ${QQ_APP_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TTL_SECONDS: ${AUTH_TTL_SECONDS:-2592000}
      # Python Telegram sidecar (telegram-worker service below)
      TELEGRAM_SIDECAR_URL: http://telegram-worker:9400
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required, set it in .env.production}
    # No host port — reached only through the nginx reverse proxy.

  telegram-worker:
    build:
      context: .
      dockerfile: apps/telegram-worker/Dockerfile
    container_name: sm-telegram-worker
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?TELEGRAM_API_ID is required, set it in .env.production}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?TELEGRAM_API_HASH is required, set it in .env.production}
      # Push captured messages into the NestJS ingest endpoint (overrides the
      # worker.py default of http://localhost:3001/... since inside the
      # compose network the api service is reachable at http://api:3001).
      TELEGRAM_INGEST_URL: http://api:3001/api/internal/telegram/ingest
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required, set it in .env.production}
      TELEGRAM_WORKER_HOST: 0.0.0.0
      TELEGRAM_WORKER_PORT: "9400"
      # Connect timeout for the Telethon session bootstrap (seconds).
      TELEGRAM_CONNECT_TIMEOUT: ${TELEGRAM_CONNECT_TIMEOUT:-20}
    # No host port — reached only by the api service over the compose network.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/web3/monitor}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/web3/monitor}
    container_name: sm-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
    # No host port — reached only through the nginx reverse proxy.

  nginx:
    image: nginx:alpine
    container_name: sm-nginx
    restart: unless-stopped
    depends_on:
      - web
      - api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
